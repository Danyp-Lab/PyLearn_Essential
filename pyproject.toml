[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylearn-essential"
version = "1.0.0"
description = "Comprehensive Python learning repository covering core concepts, algorithms, AI/ML, and GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]
